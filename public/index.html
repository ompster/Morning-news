<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1722">
<title>Morning news</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Morning news</h1>
      <p class="date" id="date"></p>
    </div>
    <button class="linkbtn" id="refresh">Refresh</button>
  </header>

  <button class="play" id="play" disabled>
    <span><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><span id="playLabel">Play the news</span></span>
    <span id="count"></span>
  </button>

  <ul id="list" aria-label="News sources"></ul>
  <footer><span id="updated"></span> <button class="linkbtn" id="settingsBtn">Settings</button></footer>
</main>

<div id="mini" hidden>
  <div class="top">
    <div class="t"><b id="mSrc"></b><span id="mHl"></span></div>
    <button class="chip" id="skipIntro" hidden>Skip intro</button>
  </div>
  <div class="seek">
    <span id="tCur">0:00</span>
    <input type="range" id="bar" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span id="tLeft">-0:00</span>
  </div>
  <div class="ctrls">
    <button id="prev" aria-label="Previous bulletin"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="back" aria-label="Back 15 seconds" class="jump"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><i>15</i></button>
    <button id="pp" aria-label="Play or pause"><svg id="ppIcon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
    <button id="fwd" aria-label="Forward 30 seconds" class="jump"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><i>30</i></button>
    <button id="next" aria-label="Next bulletin"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</div>

<div id="toast" role="status" hidden><span id="toastMsg"></span><button class="linkbtn" id="toastAct"></button></div>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label class="opt"><input type="checkbox" id="incPlayed"> Include already played bulletins in Play all</label>
    <h3>Ad trimming</h3>
    <p class="help">Seconds skipped at the start and end of each source. These are learned when you skip past ads yourself, and can be changed here. Ads are inserted per play, so lengths vary a little.</p>
    <table><thead><tr><th>Source</th><th>Start</th><th>End</th><th></th></tr></thead><tbody id="trimRows"></tbody></table>
    <div class="actions"><button class="linkbtn" id="clearPlayed" type="button">Clear played history</button><button class="done">Done</button></div>
  </form>
</dialog>

<audio id="audio" preload="none"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
